# Tells Bing, Yandex and other IndexNow search engines about all pages after every update of the site.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ["sitemap.xml"]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          sleep 90  # let GitHub Pages publish first
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml", encoding="utf-8").read())
          body = json.dumps({"host": "kegeyliqm.uz", "key": "471ed1de372bfca25d3725ced9dfce23", "keyLocation": "https://kegeyliqm.uz/471ed1de372bfca25d3725ced9dfce23.txt", "urlList": urls}).encode()
          for ep in ("https://api.indexnow.org/indexnow", "https://yandex.com/indexnow"):
              req = urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"})
              try:
                  print(ep, urllib.request.urlopen(req, timeout=30).status, len(urls), "urls")
              except Exception as e:
                  print(ep, "error:", e)
          PY
